[project]
name = "startup-validator-pro"
version = "3.2.1"
description = "Valida ideias de startup usando DeepSeek V4 e pesquisa de mercado (Tavily)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "fernandodeoliveiradev", email = "fernandopaglacci@gmail.com" }]
# agno[sqlite] -> SqliteDb | agno[openai] -> provider DeepSeek/OpenAI | agno[tavily] -> TavilyTools
dependencies = [
    "agno[sqlite,openai,tavily]>=2.3.21",
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
]

[project.scripts]
startup-validator = "startup_validator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/startup_validator"]
